<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="100%" height="100%" role="img" preserveAspectRatio="xMidYMid meet">
  <title>Tongue position for the Malayalam dental th sound (ത)</title>
  <desc>Animated side view of the mouth: the tongue tip rises and presses against the back of the upper front teeth, holds, and releases.</desc>
  <style>
    .adt-tip { transform-box: view-box; animation: adt-tip 3.2s ease-in-out infinite; }
    @keyframes adt-tip {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      35%, 65% { transform: translate(14px, -30px) rotate(-12deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .adt-tip { animation: none !important; }
    }
  </style>
  <!-- head profile, facing right: cranium, neck, chin, nose -->
  <path fill="#e9e7df" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"
    d="M 300 16
       C 250 2 160 2 96 18
       C 62 28 38 46 28 74
       C 20 98 26 122 50 142
       C 68 157 90 163 112 161
       C 110 184 108 202 108 210
       L 234 210
       C 246 188 262 172 280 160
       C 292 152 302 146 308 138
       C 314 130 314 122 312 116
       C 318 110 316 100 310 94
       C 305 89 301 83 303 76
       C 306 66 307 54 305 40
       C 304 30 303 22 300 16
       Z" />
  <!-- nasal cavity: from the nose back toward the pharynx -->
  <path fill="#22261f"
    d="M 292 78
       C 250 70 200 74 156 86
       L 148 96
       C 190 88 250 82 292 90
       Z" />
  <!-- oral cavity: the mouth interior from the lips back to the pharynx -->
  <path fill="#22261f"
    d="M 290 118
       C 250 110 180 110 140 120
       C 116 125 102 134 102 148
       C 102 162 116 172 144 174
       C 190 178 250 176 290 168
       C 300 165 306 160 308 152
       C 310 142 304 128 290 118
       Z" />
  <!-- palate: hard palate, velum sloping back, uvula -->
  <path fill="#ece9dd" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"
    d="M 284 114
       C 250 108 200 108 170 113
       C 148 116 132 121 122 126
       C 117 129 114 134 118 137
       C 128 134 146 128 166 123
       C 200 117 250 116 276 120
       C 274 118 276 115 280 114
       Z" />
  <!-- alveolar ridge: the bump just behind the upper teeth -->
  <path fill="#ece9dd" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"
    d="M 268 116
       C 270 112 274 110 278 111
       C 280 115 279 119 275 120
       C 271 120 268 119 268 116
       Z" />
  <!-- upper teeth (incisors and premolar) -->
  <path fill="#f6f3e8" stroke="currentColor" stroke-width="1.5"
    d="M 272 122 L 290 120 L 288 136 L 273 137 Z" />
  <path fill="#f6f3e8" stroke="currentColor" stroke-width="1.5"
    d="M 258 117 L 266 116 L 265 125 L 257 126 Z" />
  <!-- lower teeth -->
  <path fill="#f6f3e8" stroke="currentColor" stroke-width="1.5"
    d="M 262 158 L 278 156 L 276 170 L 263 172 Z" />
  <!-- lips framing the mouth opening -->
  <path fill="#e9e7df" stroke="currentColor" stroke-width="2" stroke-linejoin="round"
    d="M 286 110 C 294 102 306 100 316 106 C 310 113 300 117 288 117 Z" />
  <path fill="#e9e7df" stroke="currentColor" stroke-width="2" stroke-linejoin="round"
    d="M 288 151 C 298 155 308 160 314 166 C 306 172 296 174 288 173 Z" />
  <!-- tongue body: root at the pharynx, blade toward the front -->
  <path fill="#d18a8e" stroke="currentColor" stroke-width="2" stroke-linejoin="round"
    d="M 106 170
       C 116 176 136 178 158 175
       C 186 172 218 170 244 168
       C 254 167 260 166 264 163
       C 266 158 265 154 260 152
       C 252 149 244 148 236 149
       C 212 151 180 154 154 158
       C 132 161 116 162 106 160
       Z" />
  <!-- tongue tip: animated rise to the back of the upper teeth; base pose is the contact target -->
  <path class="adt-tip" transform-origin="258 157" transform="translate(14 -30) rotate(-12)"
    fill="#d18a8e" stroke="currentColor" stroke-width="2" stroke-linejoin="round"
    d="M 252 150
       C 264 148 274 149 280 153
       C 284 156 284 160 279 163
       C 270 165 260 164 254 160
       Z" />
</svg>
