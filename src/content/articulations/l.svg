<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" role="img">
  <title>Tongue movement for the la sound (ല)</title>
  <style>
    .head { fill: #fafaf9; stroke: #78716c; stroke-width: 2.5 }
    .cavity { fill: #f5f5f4 }
    .palate { fill: none; stroke: #57534e; stroke-width: 4; stroke-linecap: round }
    .velum { fill: #d6d3d1; stroke: #78716c; stroke-width: 1.5 }
    .teeth { fill: #ffffff; stroke: #78716c; stroke-width: 1.5 }
    .lip { fill: #e7e5e4; stroke: #78716c; stroke-width: 1.5 }
    .jaw-line { fill: none; stroke: #78716c; stroke-width: 3.5; stroke-linecap: round }
    .tongue { fill: #fdba74; stroke: #c2410c; stroke-width: 2 }
    .air { fill: none; stroke: #78716c; stroke-width: 2; stroke-dasharray: 5 4 }
    .air-head { fill: #78716c }
    .zone { fill: none; stroke: #f59e0b; stroke-width: 2; stroke-dasharray: 4 3 }
    .zone-label { font: 10px system-ui, sans-serif; fill: #d97706 }
    .puff { fill: none; stroke: #78716c; stroke-width: 2; stroke-linecap: round }
    .sound { font: 600 15px system-ui, sans-serif; fill: #292524 }
    .sound-ml { font: 15px 'Noto Sans Malayalam', system-ui, sans-serif; fill: #57534e }
    @media (prefers-color-scheme: dark) {
      .head { fill: #1c1917; stroke: #a8a29e }
      .cavity { fill: #292524 }
      .palate { stroke: #a8a29e }
      .velum { fill: #44403c; stroke: #a8a29e }
      .teeth { fill: #44403c; stroke: #a8a29e }
      .lip { fill: #44403c; stroke: #a8a29e }
      .jaw-line { stroke: #a8a29e }
      .tongue { fill: #c2410c; stroke: #fdba74 }
      .air, .puff { stroke: #a8a29e }
      .air-head { fill: #a8a29e }
      .zone { stroke: #fbbf24 }
      .zone-label { fill: #fbbf24 }
      .sound { fill: #fafaf9 }
      .sound-ml { fill: #d6d3d1 }
    }
    @media (prefers-reduced-motion: no-preference) {
      .tongue {
        animation: gesture 4s ease-in-out infinite;
        transform-origin: 150px 120px;
      }
      @keyframes gesture {
        0%, 10% { transform: translate(0px, 16px) rotate(-4deg) }
        45%, 85% { transform: none }
        100% { transform: translate(0px, 16px) rotate(-4deg) }
      }
    }
  </style>
  <path class="head" d="M342 48 C310 16 232 12 172 28 C140 35 116 50 100 68 C92 76 86 84 87 92 L95 97 C100 99 101 100 101 118 C96 130 90 142 94 154 C102 168 118 180 150 184 C190 189 240 190 280 184 L322 178 C336 168 344 152 346 132 C349 100 350 70 342 48 Z"/>
  <path class="cavity" d="M104 104 C130 88 174 73 214 73 C234 74 241 82 241 94 C241 106 240 114 236 120 C247 130 250 144 244 153 C224 160 190 160 158 155 C132 150 114 143 108 129 C105 120 104 112 104 104 Z"/>
  <path class="palate" d="M106 102 C138 87 186 74 222 73"/>
  <path class="velum" d="M222 73 C232 77 239 84 240 93 L236 106 C234 110 231 109 230 104 C229 100 229 93 228 88 Z"/>
  <rect class="teeth" x="108" y="100" width="6" height="11" rx="2.5"/>
  <rect class="teeth" x="116" y="100" width="6" height="11" rx="2.5"/>
  <rect class="teeth" x="124" y="100" width="6" height="11" rx="2.5"/>
  <path class="jaw-line" d="M106 128 C132 140 170 149 208 150"/>
  <rect class="teeth" x="110" y="117" width="6" height="10" rx="2.5"/>
  <rect class="teeth" x="118" y="117" width="6" height="10" rx="2.5"/>
  <rect class="teeth" x="126" y="117" width="6" height="10" rx="2.5"/>
  <path class="lip" d="M88 96 C94 98 100 99 103 102 C105 104 103 107 99 108 C94 109 90 106 88 102 Z"/>
  <path class="lip" d="M88 124 C94 122 100 121 103 118 C105 116 103 113 99 113 C94 112 90 115 88 118 Z"/>
  <g class="tongue">
    <path d="M124 92 C118 98 118 112 124 122 C132 130 142 132 152 129 C166 124 170 112 184 107 C204 101 224 104 234 114 C240 121 238 132 228 140 C208 150 180 152 156 150 C136 148 122 140 120 130 C119 118 123 106 124 92 Z"/>
  </g>
  <ellipse class="zone" cx="130" cy="96" rx="12" ry="9"/>
  <text class="zone-label" x="130" y="80" text-anchor="middle">ridge</text>
  <text class="sound" x="36" y="34">l</text>
  <text class="sound-ml" x="50" y="34">ല</text>
</svg>
