<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 140" role="img">
  <title>Tongue position for the Malayalam retroflex t sound (ട)</title>
  <desc>Side view of the mouth: the tongue tip curls back so its underside touches the roof of the mouth just behind the gum ridge.</desc>
  <!-- head profile, facing left -->
  <path fill="#e2e8f0" stroke="#334155" stroke-width="2.5" stroke-linejoin="round"
    d="M 150 30
       C 148 14 134 8 116 8
       C 90 8 70 14 58 26
       C 50 34 46 42 43 48
       L 37 55
       L 28 62
       L 35 67
       L 31 72
       L 25 76
       L 32 81
       C 36 87 42 91 52 92
       C 66 94 82 94 94 89
       C 106 84 116 78 122 71
       C 134 62 144 50 148 38
       Z" />
  <!-- mouth cavity -->
  <path fill="#334155"
    d="M 28 70 C 44 66 68 65 92 71 C 96 76 96 80 92 84 C 68 84 44 82 29 80 Z" />
  <!-- upper teeth -->
  <path fill="#f8fafc" d="M 29 70 L 37 69.5 L 37 76 L 29 76.5 Z" />
  <!-- alveolar ridge -->
  <path fill="#fbbf24" stroke="#b45309" stroke-width="1"
    d="M 37 69 C 40 67.5 43 67.5 46 68 L 44 70.5 C 41 71 39 71 37 70.5 Z" />
  <!-- tongue: tip folded back, underside against the roof behind the ridge -->
  <path fill="#fb923c" stroke="#c2410c" stroke-width="2" stroke-linejoin="round"
    d="M 90 83
       C 80 84 68 81 62 75
       C 58 70 57 67 58 65.5
       C 61 64 66 64 70 66
       C 66 68.5 62 70.5 58 72.5
       C 62 76 74 79 86 81
       Z" />
</svg>
